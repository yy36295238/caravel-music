name: Build desktop applications
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 同一 Release 的 latest.json 由各平台依次补全，避免并发覆盖平台条目。
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); const c=require('./src-tauri/tauri.conf.json'); if(process.env.RELEASE_TAG !== 'v'+p.version || p.version !== c.version) throw new Error('Release tag and application versions must match');"
      - name: Build signed updater and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 留声 ${{ github.ref_name }}
          releaseDraft: true
          # GitHub 会移除附件名中的中文，固定英文名使更新清单能匹配签名附件。
          assetNamePattern: liusheng_[version]_[platform]_[arch][setup][ext]
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Validate native library and media boundary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            src-tauri/target/${{ matrix.target }}/release/liusheng.exe --self-check
          elif [[ "${{ matrix.target }}" == "$(rustc -vV | sed -n 's/^host: //p')" ]]; then
            src-tauri/target/${{ matrix.target }}/release/liusheng --self-check
          else
            # 交叉编译产物不能假设可在当前架构运行；在宿主架构检查同一套库逻辑。
            cargo run --release --manifest-path src-tauri/Cargo.toml -- --self-check
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: liusheng-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
          if-no-files-found: error
