[package]
name = "liusheng"
version = "0.1.0"
description = "轻量本地音乐播放器"
authors = ["Liusheng"]
edition = "2021"
default-run = "liusheng"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
lofty = "0.25.2"
encoding_rs = "0.8"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

# 复用 Tauri 已依赖的 AppKit 绑定，跨屏定位统一使用系统逻辑坐标。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSScreen", "NSWindow", "NSStatusBar"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
